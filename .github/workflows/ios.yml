name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project prx.xcodeproj -scheme prx -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            LK_SANDBOX_ID="${{ secrets.LK_SANDBOX_ID }}" \
            LK_TOKEN_URL="${{ secrets.LK_TOKEN_URL }}" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/prx.app Payload/
          zip -qry prx.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: prx-ipa
          path: ios/prx.ipa
